name: adliya-puls
x-puls: &puls
  build: .
  image: adliya-puls
  env_file: .env
  environment:
    GEMINI_SA: /run/secrets/gemini-sa.json
  volumes:
    - ./data:/srv/data
    - ./secrets/gemini-sa.json:/run/secrets/gemini-sa.json:ro
  restart: unless-stopped

services:
  web:        # panel va API (gunicorn)
    <<: *puls
    ports:
      - "127.0.0.1:${HOST_PORT:-8121}:8000"   # faqat shu kompyuterdan; tashqariga nginx orqali
  bot:        # Telegram bot, brifinglar (bitta nusxa!)
    <<: *puls
    command: python manage.py run_bot

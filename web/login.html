<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puls — kirish</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f6f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c1c1e'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-weight='700' font-size='20' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preload" href="static/vendor/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/puls.css">
<script>
  (function () { var t = null; try { t = localStorage.getItem("puls-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .gate { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .in { padding: 28px 28px 24px; }
  .brand b { font: 650 22px/1 var(--display); letter-spacing: -.02em; color: var(--ink); }
  h1 { margin: 22px 0 20px; font: 640 19px/1.3 var(--display); letter-spacing: -.01em; color: var(--ink); }
  .f { display: grid; gap: 6px; margin-bottom: 14px; }
  .f label { font-size: 14px; font-weight: 600; color: var(--ink); }
  .f input { height: 44px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding: 0 12px; font: 15.5px var(--font); color: var(--ink); width: 100%; }
  .f input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pw { position: relative; }
  .pw input { padding-right: 46px; }
  .eye { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--muted); }
  .eye:hover { color: var(--ink); background: var(--surface-3); }
  .eye .i { width: 19px; height: 19px; }
  .go { width: 100%; height: 46px; justify-content: center; font-size: 15.5px; margin-top: 4px; }
  .go[disabled] { opacity: .6; cursor: wait; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--risk-ink); }
  .bad { animation: shake .36s; }
  @keyframes shake { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  @media (max-width: 420px) { .in { padding: 24px 20px 20px; } }
  @media (prefers-reduced-motion: reduce) { .bad { animation: none; } }
</style>
</head>
<body>
<div class="gate" role="main">
  <div class="in">
    <div class="brand"><b>Puls</b></div>
    <form id="login">
      <h1>Panelga kirish</h1>
      <div class="f"><label for="lg">Login</label><input id="lg" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="f"><label for="pw">Parol</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="Parolni ko'rsatish"><svg class="i"><use href="static/vendor/icons.svg#i-eye"/></svg></button></div></div>
      <button class="btn btn-dark go" id="go">Kirish</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  $("eye").addEventListener("click", function () {
    var inp = $("pw"), show = inp.type === "password";
    inp.type = show ? "text" : "password";
    this.setAttribute("aria-label", show ? "Parolni yashirish" : "Parolni ko'rsatish");
    inp.focus();
  });
  $("login").addEventListener("submit", async function (e) {
    e.preventDefault();
    var b = $("go"); b.disabled = true; b.textContent = "Tekshirilmoqda";
    var r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login: $("lg").value, password: $("pw").value }) }).catch(function () { return null; });
    if (r && r.ok) { location.href = "./"; return; }
    var j = r ? await r.json().catch(function () { return {}; }) : {};
    b.disabled = false; b.textContent = "Kirish";
    $("msg").textContent = j.detail || "Server javob bermadi";
    var f = $("login"); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad");
    $("pw").select();
  });
  $("lg").focus();
</script>
</body>
</html>

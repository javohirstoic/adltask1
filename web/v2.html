<meta name="description" content="Telegram ish guruhlaridan rahbar uchun loyihalar va jamoa nazorati">

<link rel="stylesheet" href="static/puls2.css">
<script>
  // Mavzu sahifa chizilishidan oldin: asosiy — yorug'; qorong'i faqat foydalanuvchi o'zi tanlasa
  (function () { var t = null; try { t = localStorage.getItem("puls-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side" aria-label="Menyu">
    <a class="sb-brand" href="./" aria-label="Puls, bosh sahifa">

    <nav class="snav" id="nav" aria-label="Bo'limlar"></nav>
    <div class="sb-foot">
      <h3>Ma'lumot manbasi</h3>
      <div class="sf-row live" id="live" title="Yangi xabar kelishi bilan panel o'zi yangilanadi"><i></i><span>Jonli</span></div>
      <div id="sideInfo"></div>
    </div>
  </aside>
  <div class="sb-scrim" id="sideScrim"></div>

  <div class="mainwrap">

      <div class="menu" id="menu">
        <button class="icon-btn" id="menuBtn" aria-label="Menyu" aria-haspopup="true"><svg class="i" aria-hidden="true"><use href="static/vendor/icons.svg#i-more"/></svg></button>
        <div class="pop" role="menu">
          <button data-m="addperson"><svg class="i"><use href="static/vendor/icons.svg#i-user-plus"/></svg>Xodim qo'shish</button>

          <button data-m="bottest"><svg class="i"><use href="static/vendor/icons.svg#i-check"/></svg>Botni sinash</button>
          <button data-m="excel"><svg class="i"><use href="static/vendor/icons.svg#i-download"/></svg>Excel hisobot</button>
          <button data-m="import"><svg class="i"><use href="static/vendor/icons.svg#i-upload"/></svg>Guruh tarixini yuklash</button>

          <button data-m="tv"><svg class="i"><use href="static/vendor/icons.svg#i-tv"/></svg>Katta ekranda ko'rsatish</button>

          <a href="taqdimot" target="_blank" rel="noopener"><svg class="i"><use href="static/vendor/icons.svg#i-present"/></svg>Taqdimot</a>

          <button data-m="guide"><svg class="i"><use href="static/vendor/icons.svg#i-help"/></svg>Guruhda yozish formati</button>

    <div class="hist" id="hist" hidden></div>
    <div class="role-note" id="roleNote" hidden></div>

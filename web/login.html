<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puls — kirish</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f6f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c1c1e'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-weight='700' font-size='20' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preload" href="static/vendor/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/puls.css">
<script>
  (function () { var t = null; try { t = localStorage.getItem("puls-theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .gate { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .in { padding: 26px 28px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand b { font: 600 20px/1 var(--display); letter-spacing: -.02em; color: var(--ink); }
  p { margin: 18px 0 18px; color: var(--text-2); font-size: 15px; }
  .field { display: block; margin-bottom: 12px; font-size: 13.5px; color: var(--muted); }
  .field input { display: block; width: 100%; height: 48px; margin-top: 6px; padding: 0 14px; font: 500 16px var(--display); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); }
  .field input:focus { outline: 2px solid var(--azure); outline-offset: -1px; border-color: transparent; }
  .btn { width: 100%; height: 48px; margin-top: 6px; font: 600 15px var(--display); color: #fff; background: var(--ink); border: 0; border-radius: var(--r); cursor: pointer; }
  .gate.bad { animation: shake .36s; }
  @keyframes shake { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  .msg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--risk-ink); }
  .foot { padding: 14px 28px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="gate" role="main">
  <div class="in">
    <div class="brand"><b>Puls</b></div>
    <p>Panelga kirish</p>
    <form id="f" autocomplete="on">
      <label class="field">Login<input id="u" name="username" autocomplete="username" required autofocus></label>
      <label class="field">Parol<input id="pw" name="password" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" type="submit">Kirish</button>
    </form>
  </div>
  <div class="foot">Login va parolni administrator beradi</div>
</div>
<script>
  var busy = false;
  function csrf() { return (document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || ""; }
  async function submit() {
    if (busy) return; busy = true;
    var r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() },
      body: JSON.stringify({ username: document.getElementById("u").value.trim(), password: document.getElementById("pw").value }) });
    busy = false;
    if (r.ok) { location.href = "./"; return; }
    var j = await r.json().catch(function () { return {}; });
    document.getElementById("msg").textContent = r.status === 429 ? "Ko'p urinish. Birozdan keyin qayta urinib ko'ring." : (j.detail || "Kirib bo'lmadi");
    var g = document.querySelector(".gate"); g.classList.remove("bad"); void g.offsetWidth; g.classList.add("bad");
    document.getElementById("pw").value = ""; document.getElementById("pw").focus();
  }
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); submit(); });
</script>
</body>
</html>
